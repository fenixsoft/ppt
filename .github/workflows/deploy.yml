name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# 设置权限
permissions:
  contents: read
  pages: write
  id-token: write

# 并发控制
concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      # 纯静态站点，无需构建：仓库根即站点根，
      # 通过 ppt.icyfenix.cn/ioc/ 访问 ioc deck
      - name: Assemble site
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' ./ _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  cdn-refresh:
    runs-on: ubuntu-latest
    needs: deploy
    if: success()
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 预热列表按当前文件树生成，避免硬编码页面清单过期
      - name: Build warmup URL list
        run: |
          {
            echo "https://${CDN_DOMAIN}/"
            echo "https://${CDN_DOMAIN}/ioc/"
            echo "https://${CDN_DOMAIN}/ioc/index.html"
            for f in ioc/slides/*.html; do
              echo "https://${CDN_DOMAIN}/ioc/slides/$(basename "$f")"
            done
          } > warmup-urls.txt
        env:
          CDN_DOMAIN: ${{ secrets.CDN_DOMAIN }}

      - name: Refresh Tencent CDN
        run: npm run cdn:refresh
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
          CDN_DOMAIN: ${{ secrets.CDN_DOMAIN }}
        continue-on-error: true
